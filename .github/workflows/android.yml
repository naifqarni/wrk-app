name: Android apk
# Builds an installable release APK on GitHub's runner (no Expo account needed).
# Keys come from the repository's secrets; they are public keys, but they stay out of the code.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Write .env from secrets
        env:
          SHOP_API_URL: ${{ secrets.EXPO_PUBLIC_SHOP_API_URL }}
          SHOP_KEY: ${{ secrets.EXPO_PUBLIC_SHOP_KEY }}
          MOYASAR_KEY: ${{ secrets.EXPO_PUBLIC_MOYASAR_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "EXPO_PUBLIC_SHOP_API_URL=${SHOP_API_URL:-https://api.wrk.sa}"
            echo "EXPO_PUBLIC_SHOP_KEY=${SHOP_KEY}"
            echo "EXPO_PUBLIC_MOYASAR_PUBLISHABLE_KEY=${MOYASAR_KEY}"
            echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          } > .env
          for k in EXPO_PUBLIC_SHOP_KEY EXPO_PUBLIC_MOYASAR_PUBLISHABLE_KEY; do
            grep -q "^$k=." .env && echo "$k set" || echo "::warning::$k is empty: the app runs on bundled data or demo payment"
          done
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build release apk
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/wrk-$(node -p "require('./app.json').expo.version").apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: wrk-android-apk
          path: out/*.apk
